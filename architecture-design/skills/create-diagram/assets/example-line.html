<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly signups · Line chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#f8f8f8; --color-ink:#171717; --color-muted:#4d4d4d; --color-accent:#ef6306; --font-sans:'Inter',system-ui,sans-serif; --font-mono:'SF Mono',ui-monospace,monospace; }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-sans); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Line · Diagram Design</p>
    <h1>Organic search drove most of the growth</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="line-title line-desc">
      <title id="line-title">Organic search drove most of the growth</title>
      <desc id="line-desc">Organic search drove most of the growth. Line chart of weekly signups from organic, direct and referral channels across weeks W1 through W8, with a weekly target of 150 and two marked causes: guides published in W4 and a public holiday in W5.</desc>
      <rect width="100%" height="100%" fill="#f8f8f8"/>
      <text x="64" y="60" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace">Signups per week</text>
      <!-- Range-frame axes: each rule spans only the data min to max -->
      <line data-axis="y" x1="64" y1="80" x2="64" y2="410" stroke="#616161" stroke-width="1"/>
      <line data-axis="x" x1="80" y1="428" x2="472" y2="428" stroke="#616161" stroke-width="1"/>
      <text data-tick="y" data-value="210" x="56" y="83" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace" text-anchor="end">210</text>
      <text data-tick="y" data-value="120" x="56" y="263" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace" text-anchor="end">120</text>
      <text data-tick="y" data-value="45" x="56" y="413" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace" text-anchor="end">45</text>
      <text x="80" y="444" fill="#4d4d4d" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">W1</text>
      <text x="136" y="444" fill="#4d4d4d" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">W2</text>
      <text x="192" y="444" fill="#4d4d4d" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">W3</text>
      <text x="248" y="444" fill="#4d4d4d" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">W4</text>
      <text x="304" y="444" fill="#4d4d4d" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">W5</text>
      <text x="360" y="444" fill="#4d4d4d" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">W6</text>
      <text x="416" y="444" fill="#4d4d4d" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">W7</text>
      <text x="472" y="444" fill="#4d4d4d" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">W8</text>
      <!-- Comparison: weekly target, drawn under the data -->
      <line data-ref="target" data-value="150" x1="80" y1="200" x2="472" y2="200" stroke="#616161" stroke-width="1" stroke-dasharray="4,3"/>
      <text data-ref="target" data-role="label" x="488" y="203" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace">Target: 150 a week</text>
      <!-- Causes marked in place: vertical dashed 2,3, x on the category's own x -->
      <g data-event="W4" data-event-label="Two guides published">
        <line x1="248" y1="80" x2="248" y2="410" stroke="#616161" stroke-width="1" stroke-dasharray="2,3"/>
        <text x="244" y="90" fill="#171717" font-size="10" font-style="italic" font-family="'Inter', sans-serif" text-anchor="end">Two guides published</text>
      </g>
      <g data-event="W5" data-event-label="Public holiday">
        <line x1="304" y1="80" x2="304" y2="410" stroke="#616161" stroke-width="1" stroke-dasharray="2,3"/>
        <text x="308" y="90" fill="#171717" font-size="10" font-style="italic" font-family="'Inter', sans-serif">Public holiday</text>
      </g>
      <!-- Series: accent focal line, ink solid, muted dash 6,3. Every series is named at its last point, so there is no legend. -->
      <polyline data-line="Referral" data-values="45,52,48,60,55,68,62,75" points="80,410 136,396 192,404 248,380 304,390 360,364 416,376 472,350" fill="none" stroke="#4d4d4d" stroke-width="1.2" stroke-dasharray="6,3" stroke-linejoin="round"/>
      <polyline data-line="Direct" data-values="80,82,88,90,86,92,95,98" points="80,340 136,336 192,324 248,320 304,328 360,316 416,310 472,304" fill="none" stroke="#171717" stroke-width="1.2" stroke-linejoin="round"/>
      <polyline data-line="Organic" data-values="120,126,132,170,162,178,195,210" points="80,260 136,248 192,236 248,160 304,176 360,144 416,110 472,80" fill="none" stroke="#ef6306" stroke-width="1.8" stroke-linejoin="round"/>
      <circle cx="472" cy="80" r="4" fill="#ef6306"/>
      <text data-line="Referral" data-role="name" x="488" y="354" fill="#4d4d4d" font-size="11" font-weight="500" font-family="'Inter', sans-serif">Referral</text>
      <text data-line="Direct" data-role="name" x="488" y="308" fill="#4d4d4d" font-size="11" font-weight="500" font-family="'Inter', sans-serif">Direct</text>
      <text data-line="Organic" data-role="name" x="488" y="84" fill="#171717" font-size="11" font-weight="600" font-family="'Inter', sans-serif">Organic</text>
      <text data-role="source" x="64" y="484" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace">Source: illustrative analytics, W1 to W8. Signups per week. Y axis 45 to 210, not from zero. Dashed: weekly target.</text>
    </svg>
  </div>
</body>
</html>
