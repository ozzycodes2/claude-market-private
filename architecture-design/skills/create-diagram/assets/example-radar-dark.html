<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Storage backends · Capability radar</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #010102;
      --color-ink:     #f7f8f8;
      --color-muted:   #d0d6e0;
      --color-accent:  #ef6306;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-mono:     'SF Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Radar · Diagram Design</p>
    <h1>Storage backends · Capability radar</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="radar-dark-title radar-dark-desc">
      <title id="radar-dark-title">MinIO leads on three of five capabilities</title>
      <desc id="radar-dark-desc">MinIO leads on three of five capabilities. Radar chart comparing MinIO, Amazon S3, Ceph, and Google Cloud Storage across five storage capabilities.</desc>
        <rect width="100%" height="100%" fill="#010102"/>

        <!-- Grid rings at 0.25 / 0.5 / 0.75 / 1.0 of the scale (2.5, 5, 7.5, 10). Outer ring is the traced maximum, so it takes soft; inner rings and spokes are ink at 0.08. -->
        <polygon points="500,200 538,228 524,272 476,272 462,228" fill="none" stroke="rgba(247,248,248,0.08)" stroke-width="0.8"/>
        <polygon points="500,160 576,215 547,305 453,305 424,215" fill="none" stroke="rgba(247,248,248,0.08)" stroke-width="0.8"/>
        <polygon points="500,120 614,203 571,337 429,337 386,203" fill="none" stroke="rgba(247,248,248,0.08)" stroke-width="0.8"/>
        <polygon points="500,80 652,191 594,369 406,369 348,191" fill="none" stroke="#8a8f98" stroke-width="1"/>

        <!-- Axis spokes -->
        <line x1="500" y1="240" x2="500" y2="80" stroke="rgba(247,248,248,0.08)" stroke-width="1"/>
        <line x1="500" y1="240" x2="652" y2="191" stroke="rgba(247,248,248,0.08)" stroke-width="1"/>
        <line x1="500" y1="240" x2="594" y2="369" stroke="rgba(247,248,248,0.08)" stroke-width="1"/>
        <line x1="500" y1="240" x2="406" y2="369" stroke="rgba(247,248,248,0.08)" stroke-width="1"/>
        <line x1="500" y1="240" x2="348" y2="191" stroke="rgba(247,248,248,0.08)" stroke-width="1"/>

        <!-- Axis labels, one or two words, clockwise from the top: data path, then operations, then ecosystem -->
        <text x="500" y="62" fill="#f7f8f8" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Small-file handling</text>
        <text x="669" y="189" fill="#f7f8f8" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="start">Large-object reads</text>
        <text x="605" y="400" fill="#f7f8f8" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="start">Write throughput</text>
        <text x="395" y="400" fill="#f7f8f8" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="end">Operational simplicity</text>
        <text x="331" y="189" fill="#f7f8f8" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="end">Iceberg integration</text>

        <!-- Scale ticks on the first (top) axis only -->
        <text x="494" y="82" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="end">10</text>
        <text x="494" y="122" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="end">7.5</text>
        <text x="494" y="162" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="end">5</text>
        <text x="494" y="202" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="end">2.5</text>

        <!-- Non-focal series, smallest first. Strokes follow the style-guide series table: ink solid, muted 6,3, soft 2,3. No second hue. -->
        <!-- Ceph - muted dashed 6,3 - [7,7,7,4,6] -->
        <polygon points="500,128 607,205 566,331 462,292 409,210" fill="rgba(208,214,224,0.06)" stroke="#d0d6e0" stroke-width="1.5" stroke-dasharray="6,3"/>
        <!-- Google Cloud Storage - soft dotted 2,3 - [6,9,8,6,7] -->
        <polygon points="500,144 637,196 575,344 444,318 393,205" fill="rgba(138,143,152,0.06)" stroke="#8a8f98" stroke-width="1.5" stroke-dasharray="2,3"/>
        <!-- Amazon S3 - ink solid - [6,10,9,5,8] -->
        <polygon points="500,144 652,191 585,356 453,305 378,200" fill="rgba(247,248,248,0.06)" stroke="#f7f8f8" stroke-width="1.5"/>

        <!-- Focal series - MinIO - accent - [9,8,9,9,9] -->
        <polygon points="500,96 622,200 585,356 415,356 363,196" fill="rgba(239,99,6,0.14)" stroke="#ef6306" stroke-width="1.8"/>

        <!-- Focal vertex dots (only on the focal series) -->
        <circle cx="500" cy="96" r="4" fill="#ef6306"/>
        <circle cx="622" cy="200" r="4" fill="#ef6306"/>
        <circle cx="585" cy="356" r="4" fill="#ef6306"/>
        <circle cx="415" cy="356" r="4" fill="#ef6306"/>
        <circle cx="363" cy="196" r="4" fill="#ef6306"/>

        <!-- Direct series labels with leaders, each at the series' most distinctive vertex (replaces the legend) -->
        <line x1="652" y1="191" x2="680" y2="149" stroke="#8a8f98" stroke-width="0.8"/>
        <text x="684" y="152" fill="#f7f8f8" font-size="11" font-weight="500" font-family="'Inter', sans-serif" text-anchor="start">Amazon S3</text>
        <line x1="462" y1="292" x2="334" y2="297" stroke="#8a8f98" stroke-width="0.8"/>
        <text x="330" y="300" fill="#f7f8f8" font-size="11" font-weight="500" font-family="'Inter', sans-serif" text-anchor="end">Ceph</text>
        <line x1="393" y1="205" x2="334" y2="145" stroke="#8a8f98" stroke-width="0.8"/>
        <text x="330" y="148" fill="#f7f8f8" font-size="11" font-weight="500" font-family="'Inter', sans-serif" text-anchor="end">Google Cloud Storage</text>
        <line x1="415" y1="356" x2="334" y2="369" stroke="#8a8f98" stroke-width="0.8"/>
        <text x="330" y="372" fill="#f7f8f8" font-size="11" font-weight="500" font-family="'Inter', sans-serif" text-anchor="end">MinIO, recommended</text>

        <!-- Source line -->
        <text data-role="source" x="40" y="472" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace">Source: illustrative storage review scores, Q3 2026. Scale 0 to 10 per axis, higher is better.<tspan x="40" dy="12">Axes run clockwise from the top. Read vertices on each axis, not polygon area.</tspan></text>
      </svg>
  </div>
</body>
</html>
