<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milestones have come faster since Design v1 · Timeline</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #010102;
      --color-ink:     #f7f8f8;
      --color-muted:   #d0d6e0;
      --color-accent:  #ef6306;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-mono:     'SF Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Timeline · Diagram Design</p>
    <h1>Milestones have come faster since Design v1</h1>

    <svg viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="timeline-dark-title timeline-dark-desc">
      <title id="timeline-dark-title">Milestones have come faster since Design v1</title>
      <desc id="timeline-dark-desc">Milestones have come faster since Design v1. Timeline showing product milestones from the first post in February 2025 through three design versions and the schematic skill in April 2026.</desc>
        <rect width="100%" height="100%" fill="#010102"/>


        <!-- Baseline -->
        <line x1="80" y1="240" x2="920" y2="240" stroke="#8a8f98" stroke-width="1"/>

        <!-- Year boundary tick (between 2025 and 2026) -->
        <line x1="716" y1="232" x2="716" y2="248" stroke="#8a8f98" stroke-width="1"/>
        <text x="716" y="260" fill="#8a8f98" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">Jan 2026</text>

        <!-- Start / end caps -->
        <line x1="80" y1="232" x2="80" y2="248" stroke="#8a8f98" stroke-width="1"/>
        <line x1="920" y1="232" x2="920" y2="248" stroke="#8a8f98" stroke-width="1"/>

        <!-- Event 1: FEB 2025 · First post (below) -->
        <line x1="100" y1="240" x2="100" y2="296" stroke="#8a8f98" stroke-width="1"/>
        <circle cx="100" cy="240" r="4" fill="#f7f8f8"/>
        <text x="100" y="312" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">Feb 2025</text>
        <text x="100" y="328" fill="#f7f8f8" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">First post</text>

        <!-- Event 2: APR 2025 · Design v1 (above) -->
        <line x1="212" y1="184" x2="212" y2="240" stroke="#8a8f98" stroke-width="1"/>
        <circle cx="212" cy="240" r="4" fill="#f7f8f8"/>
        <text x="212" y="156" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">Apr 2025</text>
        <text x="212" y="172" fill="#f7f8f8" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Design v1</text>

        <!-- Event 3: SEP 2025 · Design v2 (below) -->
        <line x1="492" y1="240" x2="492" y2="296" stroke="#8a8f98" stroke-width="1"/>
        <circle cx="492" cy="240" r="4" fill="#f7f8f8"/>
        <text x="492" y="312" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">Sep 2025</text>
        <text x="492" y="328" fill="#f7f8f8" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Design v2</text>
        <text x="492" y="344" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">typography pass</text>

        <!-- Event 4: JAN 2026 · Design v3 (above, accent major) -->
        <line x1="716" y1="160" x2="716" y2="240" stroke="#ef6306" stroke-width="1"/>
        <circle cx="716" cy="240" r="6" fill="#ef6306"/>
        <text x="716" y="128" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">Jan 2026</text>
        <text x="716" y="148" fill="#f7f8f8" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Design v3</text>
        <text x="716" y="164" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">complexity budget</text>

        <!-- Event 5: APR 2026 · now · Diagram Design skill (below, accent) -->
        <line x1="884" y1="240" x2="884" y2="296" stroke="#ef6306" stroke-width="1"/>
        <circle cx="884" cy="240" r="6" fill="#ef6306"/>
        <text x="884" y="312" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">Apr 2026 · now</text>
        <text x="884" y="328" fill="#f7f8f8" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Schematic skill</text>
        <text x="884" y="344" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">eight diagram types</text>

        <!-- Legend -->
        <line x1="40" y1="376" x2="960" y2="376" stroke="rgba(247,248,248,0.10)" stroke-width="0.8"/>

        <circle cx="52" cy="408" r="4" fill="#f7f8f8"/>
        <text x="68" y="412" fill="#d0d6e0" font-size="8.5" font-family="'Inter', sans-serif">Event</text>

        <circle cx="148" cy="408" r="6" fill="#ef6306"/>
        <text x="164" y="412" fill="#d0d6e0" font-size="8.5" font-family="'Inter', sans-serif">Major milestone</text>

        <text data-role="source" x="40" y="432" fill="#d0d6e0" font-size="8" font-family="'SF Mono', ui-monospace, monospace">Source: project release history, Feb 2025 to Apr 2026. Months; spacing is proportional to elapsed time.</text>
      </svg>
  </div>
</body>
</html>
