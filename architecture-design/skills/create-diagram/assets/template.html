<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:       #f8f8f8;
      --color-paper-2:     #ffffff;
      --color-ink:         #171717;
      --color-ink-strong:  #171717;
      --color-muted:       #4d4d4d;
      --color-soft:        #616161;
      --color-rule:        #d9d9d9;
      --color-rule-solid:  #c6c6c6;
      --color-accent:      #ef6306;
      --color-accent-tint: rgba(239,99,6,0.10);
      --color-accent-deep: #d65905;
      --font-sans: 'Inter', 'Noto Sans KR', 'Noto Sans TC', -apple-system, system-ui, sans-serif;
      /* SF Mono is not redistributable and not on Google Fonts: it resolves
         natively on macOS and falls through ui-monospace everywhere else. */
      --font-mono: 'SF Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }
    /* The SVG holds its readable width (min-width == the viewBox width, so the
       type ramp is never silently scaled down). This wrapper lets a narrow
       screen scroll the diagram instead of the whole page. */
    .diagram-container { width: 100%; overflow-x: auto; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.6875rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--color-soft);
      margin-bottom: 0.5rem;
    }

    /* No serif: the source system declares one family change and it is the
       monospace. The register shift the serif used to carry is the 2.7x size
       step between this and a 12px node name. */
    h1 {
      font-family: var(--font-sans);
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.8px;
      line-height: 1.1;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 960px; display: block; }
    /* Paper has no scrollbar, so the local scroller would clip instead of
       scroll. Let the diagram scale down to the sheet: smaller but whole
       beats sharp but cut off. Must come after the svg rule above - a media
       query adds no specificity, so a later plain rule would win. */
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">[Type] · Diagram Design</p>
    <h1>[Diagram title]</h1>

    <!-- Replace [diagram-slug] with a unique slug for this diagram before export. -->
    <div class="diagram-container">
      <svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="[diagram-slug]-title [diagram-slug]-desc">
        <title id="[diagram-slug]-title">[Diagram title]</title>
        <desc id="[diagram-slug]-desc">[One sentence describing what the diagram shows]</desc>
        <defs>
          <!-- No arrow-link marker: this skin has one chroma, so an external or
               HTTP call is `ink` at stroke-strong rather than a second hue. -->
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4d4d4d"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef6306"/></marker>
          <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#171717"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f8f8f8"/>

        <!-- Draw arrows first, then nodes. Replace with your content.
             Node boxes rx=5, zones rx=8, type tags and label masks rx=0.
             The accent paints objects only - its arrow's label is #171717. -->

      </svg>
    </div>
  </div>
</body>
</html>
