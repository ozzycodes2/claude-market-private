<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content pyramid · what compounds</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #010102;
      --color-ink:     #f7f8f8;
      --color-muted:   #d0d6e0;
      --color-accent:  #ef6306;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-mono:     'SF Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Pyramid · Diagram Design</p>
    <h1>Content pyramid · what compounds</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pyramid-dark-title pyramid-dark-desc">
      <title id="pyramid-dark-title">Content pyramid · what compounds</title>
      <desc id="pyramid-dark-desc">Content pyramid showing short posts, essays, long-form guides, and a flagship book ordered by shipping cadence and leverage.</desc>
        <rect width="100%" height="100%" fill="#010102"/>

        <!-- Left axis: direction of rarity -->
        <line x1="100" y1="40" x2="100" y2="320" stroke="#8a8f98" stroke-width="1"/>
        <polygon points="96,40 104,40 100,28" fill="#8a8f98"/>
        <text x="100" y="16" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace">Rarer, fewer, compounds</text>

        <!-- Base layer: Short posts -->
        <polygon points="244,280 756,280 820,344 180,344" fill="rgba(247,248,248,0.04)" stroke="rgba(247,248,248,0.12)" stroke-width="1"/>
        <text x="500" y="308" fill="#f7f8f8" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Short posts</text>
        <text x="500" y="324" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">daily · ~200 words</text>
        <text x="836" y="316" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace">~240/yr</text>

        <!-- L3: Essays -->
        <polygon points="308,216 692,216 756,280 244,280" fill="rgba(247,248,248,0.04)" stroke="rgba(247,248,248,0.12)" stroke-width="1"/>
        <text x="500" y="244" fill="#f7f8f8" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Essays</text>
        <text x="500" y="260" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">weekly · 800–1,500 words</text>
        <text x="776" y="252" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace">~48/yr</text>

        <!-- L2: Long-form guides -->
        <polygon points="372,152 628,152 692,216 308,216" fill="rgba(247,248,248,0.04)" stroke="rgba(247,248,248,0.12)" stroke-width="1"/>
        <text x="500" y="180" fill="#f7f8f8" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Long-form guides</text>
        <text x="500" y="196" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">quarterly · 4,000+ words</text>
        <text x="716" y="188" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace">~4/yr</text>

        <!-- Apex: Flagship book — ACCENT FOCAL (true pyramid peak — single triangle, consistent slope with layers below) -->
        <polygon points="500,24 628,152 372,152" fill="rgba(239,99,6,0.10)" stroke="#ef6306" stroke-width="1"/>
        <text x="500" y="120" fill="#f7f8f8" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Flagship book</text>
        <text x="500" y="136" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">every 3–5 years</text>
        <text x="656" y="112" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace">the apex</text>

        <!-- Footnote under pyramid -->
        <text x="500" y="384" fill="#d0d6e0" font-size="8.5" font-family="'Inter', sans-serif" text-anchor="middle" font-style="italic">The base funds the apex. The apex defines the base.</text>

        <!-- Source line. Width is rank, not quantity; no key needed, every layer is named in place. -->
        <text x="40" y="472" fill="#d0d6e0" font-size="8.5" font-family="'Inter', sans-serif">Source: illustrative publishing cadence. Width is rank, not quantity; the per-year counts are printed labels, and layer area encodes nothing.</text>
      </svg>
  </div>
</body>
</html>
