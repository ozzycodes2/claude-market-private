<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Request demand by UTC window · Polar chart</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    html, body, div, main, header, footer, section, article, p, h1, h2, h3, h4, h5, h6 { box-sizing:border-box; margin:0; padding:0; }
    :root { --color-paper:#f8f8f8; --color-ink:#171717; --color-muted:#4d4d4d; --color-accent:#ef6306; --font-sans:'Inter',system-ui,sans-serif; --font-mono:'SF Mono',ui-monospace,monospace; }
    body { font-family:var(--font-sans); background:var(--color-paper); color:var(--color-ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:3rem 2rem; }
    .frame { max-width:1200px; width:100%; }
    .eyebrow { font-family:var(--font-mono); font-size:0.66rem; font-weight:500; letter-spacing:0.18em; text-transform:uppercase; color:var(--color-muted); margin-bottom:0.5rem; }
    h1 { font-family:var(--font-sans); font-size:clamp(1.5rem,2.4vw + 0.75rem,2rem); font-weight:400; letter-spacing:-0.02em; line-height:1.15; color:var(--color-ink); margin-bottom:1.5rem; }
    svg { width:100%; min-width:900px; display:block; }
    @media (max-height:700px) {
      body { padding-top:0.75rem; padding-bottom:0.75rem; }
      .frame { max-width:960px; }
      .eyebrow { margin-bottom:0.25rem; }
      h1 { margin-bottom:0.5rem; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Polar · Diagram Design</p>
    <h1>Request demand by UTC window</h1>

    <svg viewBox="0 0 1000 520" xmlns="http://www.w3.org/2000/svg"
         role="img" aria-labelledby="polar-title polar-desc"
         data-polar-chart data-polar-cx="500" data-polar-cy="230"
         data-polar-radius="160" data-polar-min="0" data-polar-max="100"
         data-polar-start-angle="-90" data-polar-clockwise="true"
         data-polar-radius-encoding="linear" data-polar-inner-radius="0">
      <title id="polar-title">Request demand by UTC window</title>
      <desc id="polar-desc">Polar chart on a 0–100% scale identifying 12–15 UTC as the 100% peak, with the other seven UTC windows proceeding clockwise.</desc>

      <rect data-polar-background width="100%" height="100%" fill="#f8f8f8"/>
      <text x="40" y="28" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace">% of daily peak, 0 to 100</text>

      <circle data-polar-ring cx="500" cy="230" r="32" fill="none" stroke="rgba(23,23,23,0.08)" stroke-width="0.8"/>
      <circle data-polar-ring cx="500" cy="230" r="64" fill="none" stroke="rgba(23,23,23,0.08)" stroke-width="0.8"/>
      <circle data-polar-ring cx="500" cy="230" r="96" fill="none" stroke="rgba(23,23,23,0.08)" stroke-width="0.8"/>
      <circle data-polar-ring cx="500" cy="230" r="128" fill="none" stroke="rgba(23,23,23,0.08)" stroke-width="0.8"/>
      <circle data-polar-ring cx="500" cy="230" r="160" fill="none" stroke="#616161" stroke-width="0.8"/>

      <line data-polar-spoke data-polar-index="0" x1="500" y1="230" x2="500" y2="70" stroke="#616161" stroke-width="0.8"/>
      <line data-polar-spoke data-polar-index="1" x1="500" y1="230" x2="613.137" y2="116.863" stroke="#616161" stroke-width="0.8"/>
      <line data-polar-spoke data-polar-index="2" x1="500" y1="230" x2="660" y2="230" stroke="#616161" stroke-width="0.8"/>
      <line data-polar-spoke data-polar-index="3" x1="500" y1="230" x2="613.137" y2="343.137" stroke="#616161" stroke-width="0.8"/>
      <line data-polar-spoke data-polar-index="4" x1="500" y1="230" x2="500" y2="390" stroke="#616161" stroke-width="0.8"/>
      <line data-polar-spoke data-polar-index="5" x1="500" y1="230" x2="386.863" y2="343.137" stroke="#616161" stroke-width="0.8"/>
      <line data-polar-spoke data-polar-index="6" x1="500" y1="230" x2="340" y2="230" stroke="#616161" stroke-width="0.8"/>
      <line data-polar-spoke data-polar-index="7" x1="500" y1="230" x2="386.863" y2="116.863" stroke="#616161" stroke-width="0.8"/>

      <text x="508" y="233" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace">0</text>

      <g data-polar-category="00–03" data-polar-index="0" data-polar-value="32">
        <line data-polar-ray x1="500" y1="230" x2="500" y2="178.8" stroke="#4d4d4d" stroke-width="2"/>
        <circle data-polar-marker cx="500" cy="178.8" r="4" fill="#f8f8f8" stroke="#4d4d4d" stroke-width="1.2"/>
        <text x="500" y="42" fill="#171717" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">00–03</text>
        <text data-polar-value-label x="500" y="26" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">32</text>
      </g>
      <g data-polar-category="03–06" data-polar-index="1" data-polar-value="18">
        <line data-polar-ray x1="500" y1="230" x2="520.365" y2="209.635" stroke="#4d4d4d" stroke-width="2"/>
        <circle data-polar-marker cx="520.365" cy="209.635" r="4" fill="#f8f8f8" stroke="#4d4d4d" stroke-width="1.2"/>
        <text x="632.936" y="97.064" fill="#171717" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="start">03–06</text>
        <text data-polar-value-label x="644.25" y="85.75" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace" text-anchor="start">18</text>
      </g>
      <g data-polar-category="06–09" data-polar-index="2" data-polar-value="24">
        <line data-polar-ray x1="500" y1="230" x2="538.4" y2="230" stroke="#4d4d4d" stroke-width="2"/>
        <circle data-polar-marker cx="538.4" cy="230" r="4" fill="#f8f8f8" stroke="#4d4d4d" stroke-width="1.2"/>
        <text x="688" y="230" fill="#171717" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="start">06–09</text>
        <text data-polar-value-label x="704" y="230" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace" text-anchor="start" dy="16">24</text>
      </g>
      <g data-polar-category="09–12" data-polar-index="3" data-polar-value="58">
        <line data-polar-ray x1="500" y1="230" x2="565.62" y2="295.62" stroke="#4d4d4d" stroke-width="2"/>
        <circle data-polar-marker cx="565.62" cy="295.62" r="4" fill="#f8f8f8" stroke="#4d4d4d" stroke-width="1.2"/>
        <text x="632.936" y="362.936" fill="#171717" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="start">09–12</text>
        <text data-polar-value-label x="644.25" y="374.25" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace" text-anchor="start" dy="12">58</text>
      </g>
      <g data-polar-category="12–15" data-polar-index="4" data-polar-value="100" data-polar-focal="true">
        <line data-polar-ray x1="500" y1="230" x2="500" y2="390" stroke="#ef6306" stroke-width="2.4"/>
        <circle data-polar-marker cx="500" cy="390" r="5" fill="#f8f8f8" stroke="#ef6306" stroke-width="1.2"/>
        <text x="500" y="418" fill="#171717" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">12–15</text>
        <text data-polar-value-label x="500" y="434" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">100</text>
      </g>
      <g data-polar-category="15–18" data-polar-index="5" data-polar-value="82">
        <line data-polar-ray x1="500" y1="230" x2="407.227" y2="322.773" stroke="#4d4d4d" stroke-width="2"/>
        <circle data-polar-marker cx="407.227" cy="322.773" r="4" fill="#f8f8f8" stroke="#4d4d4d" stroke-width="1.2"/>
        <text x="367.064" y="362.936" fill="#171717" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="end">15–18</text>
        <text data-polar-value-label x="355.75" y="374.25" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace" text-anchor="end" dy="12">82</text>
      </g>
      <g data-polar-category="18–21" data-polar-index="6" data-polar-value="76">
        <line data-polar-ray x1="500" y1="230" x2="378.4" y2="230" stroke="#4d4d4d" stroke-width="2"/>
        <circle data-polar-marker cx="378.4" cy="230" r="4" fill="#f8f8f8" stroke="#4d4d4d" stroke-width="1.2"/>
        <text x="312" y="230" fill="#171717" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="end">18–21</text>
        <text data-polar-value-label x="296" y="230" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace" text-anchor="end" dy="16">76</text>
      </g>
      <g data-polar-category="21–24" data-polar-index="7" data-polar-value="45">
        <line data-polar-ray x1="500" y1="230" x2="449.088" y2="179.088" stroke="#4d4d4d" stroke-width="2"/>
        <circle data-polar-marker cx="449.088" cy="179.088" r="4" fill="#f8f8f8" stroke="#4d4d4d" stroke-width="1.2"/>
        <text x="367.064" y="97.064" fill="#171717" font-size="11" font-weight="600" font-family="'Inter', sans-serif" text-anchor="end">21–24</text>
        <text data-polar-value-label x="355.75" y="85.75" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace" text-anchor="end">45</text>
      </g>
      <text x="40" y="488" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace">Source: illustrative workload profile, % of daily peak. Centre is 0, outer ring is 100, rings every 20. Order runs clockwise from the top.</text>
    </svg>
  </div>
</body>
</html>
