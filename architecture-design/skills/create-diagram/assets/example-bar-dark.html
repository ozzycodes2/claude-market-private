<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sprint velocity · Bar chart · dark</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #010102;
      --color-ink:    #f7f8f8;
      --color-muted:  #d0d6e0;
      --color-accent: #ef6306;
      --font-sans:    'Inter', system-ui, sans-serif;
      --font-mono:    'SF Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-sans); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Bar · Diagram Design</p>
    <h1>Sprint velocity · 8-sprint view</h1>

<rect x="99" y="192" width="72" height="228" fill="#010102"/>

<text x="905" y="118" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle" data-for="S8">93</text>
<line x1="80" y1="103.3" x2="960" y2="103.3" stroke="#8a8f98" stroke-width="1" stroke-dasharray="4,3" data-reference="100"/>

</g>
<text x="575" y="52" fill="#f7f8f8" font-size="9" font-family="'Inter', sans-serif" text-anchor="middle" font-style="italic">Record high</text>

<text x="905" y="440" fill="#f7f8f8" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle" font-weight="600">S8</text>
<text x="40" y="478" fill="#d0d6e0" font-size="8.5" font-family="'Inter', sans-serif">Source: team sprint tracker, eight consecutive two-week sprints. Bars start at zero.</text>
</svg>
  </div>
</body>
</html>
