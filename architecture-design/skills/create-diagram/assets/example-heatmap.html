<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CI failure rate by service and sprint · Heatmap</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #f8f8f8;
      --color-ink:    #171717;
      --color-muted:  #4d4d4d;
      --color-accent: #ef6306;
      --font-sans:    'Inter', system-ui, sans-serif;
      --font-mono:    'SF Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-sans); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { display: block; width: 100%; height: auto; max-width: 100%; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Heatmap · Diagram Design</p>
    <h1>The week payments went dark</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heatmap-title heatmap-desc">
      <title id="heatmap-title">The week payments went dark</title>
      <desc id="heatmap-desc">Heatmap of CI failure rate by service and sprint; payments service spiked to 47% in sprint 4 due to a deploy regression, recovered to 4% by sprint 6; billing carries the highest baseline failure rate at 9% in sprint 3.</desc>
      <rect width="100%" height="100%" fill="#f8f8f8"/>

      <!-- Cell grid: 6 columns (x=160,280,400,520,640,760), 5 rows (y=64,124,184,244,304).
           Cell size 116×56, gap 4px (col step=120, row step=60).
           Fill: single ink ramp for non-focal cells — opacity = max(0.07, value/9·0.65).
           Focal cell (payments·S4) uses the accent fill and carries data-focal="true".
           scripts/verify-heatmap.py enforces monotone opacity against data-value for every
           non-focal cell, complete 5×6 coverage, and at most one data-focal cell. -->

      <!-- Row axis title, horizontal, level with the column headers -->
      <text x="24" y="52" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace">Service</text>

      <!-- Column headers -->
      <text data-axis="0" data-col="S1" x="218" y="52" fill="#4d4d4d" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">Sprint 1</text>
      <text data-axis="1" data-col="S2" x="338" y="52" fill="#4d4d4d" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">Sprint 2</text>
      <text data-axis="2" data-col="S3" x="458" y="52" fill="#4d4d4d" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">Sprint 3</text>
      <text data-axis="3" data-col="S4" x="578" y="52" fill="#4d4d4d" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">Sprint 4</text>
      <text data-axis="4" data-col="S5" x="698" y="52" fill="#4d4d4d" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">Sprint 5</text>
      <text data-axis="5" data-col="S6" x="818" y="52" fill="#4d4d4d" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">Sprint 6</text>

      <!-- Row labels -->
      <text data-row-label="auth" x="148" y="96" fill="#171717" font-size="9" font-family="'SF Mono', monospace" text-anchor="end">auth</text>
      <text data-row-label="payments" x="148" y="156" fill="#171717" font-size="9" font-family="'SF Mono', monospace" text-anchor="end">payments</text>
      <text data-row-label="api-gateway" x="148" y="216" fill="#171717" font-size="9" font-family="'SF Mono', monospace" text-anchor="end">api-gateway</text>
      <text data-row-label="billing" x="148" y="276" fill="#171717" font-size="9" font-family="'SF Mono', monospace" text-anchor="end">billing</text>
      <text data-row-label="notifications" x="148" y="336" fill="#171717" font-size="9" font-family="'SF Mono', monospace" text-anchor="end">notifications</text>

      <!-- Row: auth (y=64) — values 4,5,6,3,2,2 -->

      <rect data-row="auth" data-col="S1" data-value="4" x="160" y="64" width="116" height="56" fill="rgba(23,23,23,0.29)"/>
      <text x="218" y="96" fill="#171717" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">4%</text>

      <rect x="280" y="64" width="116" height="56" fill="#f8f8f8"/>
      <rect data-row="auth" data-col="S2" data-value="5" x="280" y="64" width="116" height="56" fill="rgba(23,23,23,0.36)"/>
      <text x="338" y="96" fill="#171717" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">5%</text>

      <rect x="400" y="64" width="116" height="56" fill="#f8f8f8"/>
      <rect data-row="auth" data-col="S3" data-value="6" x="400" y="64" width="116" height="56" fill="rgba(23,23,23,0.43)"/>
      <text x="458" y="96" fill="#f8f8f8" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">6%</text>

      <rect x="520" y="64" width="116" height="56" fill="#f8f8f8"/>
      <rect data-row="auth" data-col="S4" data-value="3" x="520" y="64" width="116" height="56" fill="rgba(23,23,23,0.22)"/>
      <text x="578" y="96" fill="#171717" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">3%</text>

      <rect data-row="auth" data-col="S5" data-value="2" x="640" y="64" width="116" height="56" fill="rgba(23,23,23,0.14)"/>
      <text x="698" y="96" fill="#171717" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">2%</text>

      <rect x="760" y="64" width="116" height="56" fill="#f8f8f8"/>
      <rect data-row="auth" data-col="S6" data-value="2" x="760" y="64" width="116" height="56" fill="rgba(23,23,23,0.14)"/>
      <text x="818" y="96" fill="#171717" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">2%</text>

      <!-- Row: payments (y=124) — values 3,4,5,47(focal),6,4 -->
      <rect x="160" y="124" width="116" height="56" fill="#f8f8f8"/>
      <rect data-row="payments" data-col="S1" data-value="3" x="160" y="124" width="116" height="56" fill="rgba(23,23,23,0.22)"/>
      <text x="218" y="156" fill="#171717" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">3%</text>

      <rect x="280" y="124" width="116" height="56" fill="#f8f8f8"/>
      <rect data-row="payments" data-col="S2" data-value="4" x="280" y="124" width="116" height="56" fill="rgba(23,23,23,0.29)"/>

      <rect x="400" y="124" width="116" height="56" fill="#f8f8f8"/>
      <rect data-row="payments" data-col="S3" data-value="5" x="400" y="124" width="116" height="56" fill="rgba(23,23,23,0.36)"/>
      <text x="458" y="156" fill="#171717" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">5%</text>

      <!-- FOCAL CELL: payments·S4 = 47% deploy regression -->
      <rect x="520" y="124" width="116" height="56" fill="#f8f8f8"/>
      <rect data-row="payments" data-col="S4" data-value="47" data-focal="true" x="520" y="124" width="116" height="56" fill="#ef6306" stroke="#171717" stroke-width="1.2"/>
      <text x="578" y="149" fill="#171717" font-size="10" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">47%</text>

      <rect x="760" y="124" width="116" height="56" fill="#f8f8f8"/>

      <rect x="280" y="184" width="116" height="56" fill="#f8f8f8"/>
      <rect data-row="api-gateway" data-col="S2" data-value="3" x="280" y="184" width="116" height="56" fill="rgba(23,23,23,0.22)"/>
      <text x="338" y="216" fill="#171717" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">3%</text>

      <rect x="400" y="184" width="116" height="56" fill="#f8f8f8"/>
      <rect data-row="api-gateway" data-col="S3" data-value="4" x="400" y="184" width="116" height="56" fill="rgba(23,23,23,0.29)"/>
      <text x="458" y="216" fill="#171717" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">4%</text>

      <rect x="520" y="184" width="116" height="56" fill="#f8f8f8"/>
      <rect data-row="api-gateway" data-col="S4" data-value="2" x="520" y="184" width="116" height="56" fill="rgba(23,23,23,0.14)"/>

      <rect x="640" y="184" width="116" height="56" fill="#f8f8f8"/>

      <!-- Row: billing (y=244) — values 5,7,9,6,4,3 -->

      <rect x="280" y="244" width="116" height="56" fill="#f8f8f8"/>

      <rect x="400" y="244" width="116" height="56" fill="#f8f8f8"/>
      <rect data-row="billing" data-col="S3" data-value="9" x="400" y="244" width="116" height="56" fill="rgba(23,23,23,0.65)"/>
      <text x="458" y="276" fill="#f8f8f8" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">9%</text>

      <rect x="520" y="244" width="116" height="56" fill="#f8f8f8"/>
      <rect data-row="billing" data-col="S4" data-value="6" x="520" y="244" width="116" height="56" fill="rgba(23,23,23,0.43)"/>
      <text x="578" y="276" fill="#f8f8f8" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">6%</text>

      <rect x="640" y="244" width="116" height="56" fill="#f8f8f8"/>
      <rect data-row="billing" data-col="S5" data-value="4" x="640" y="244" width="116" height="56" fill="rgba(23,23,23,0.29)"/>
      <text x="698" y="276" fill="#171717" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">4%</text>

      <rect x="760" y="244" width="116" height="56" fill="#f8f8f8"/>
      <rect data-row="billing" data-col="S6" data-value="3" x="760" y="244" width="116" height="56" fill="rgba(23,23,23,0.22)"/>

      <!-- Row: notifications (y=304) — values 1,2,2,2,1,1 -->
      <rect x="160" y="304" width="116" height="56" fill="#f8f8f8"/>
      <rect data-row="notifications" data-col="S1" data-value="1" x="160" y="304" width="116" height="56" fill="rgba(23,23,23,0.07)"/>

      <rect x="280" y="304" width="116" height="56" fill="#f8f8f8"/>

      <rect x="400" y="304" width="116" height="56" fill="#f8f8f8"/>
      <rect data-row="notifications" data-col="S3" data-value="2" x="400" y="304" width="116" height="56" fill="rgba(23,23,23,0.14)"/>

      <!-- Ink ramp strip: 8 steps low→high -->
