    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }

    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }

    svg { width: 100%; min-width: 760px; display: block; }

    <h1>The median hides the tail</h1>

    <!-- Value axis: 0-440ms over 880px, x = 80 + 2*ms, linear from zero.
         The vertical (swarm) axis carries NO meaning: each dot's y offset is
         greedy packing at pitch 10 (2r+2) around the y=230 midline, first
         free slot alternating above/below, and overlap is never resolved by
         moving a dot along the value axis. scripts/verify-beeswarm.py derives
         the value scale from the dots themselves and flags any dot that
         disagrees with its peers, any overlapping pair, and any second dot
         radius or non-focal fill. -->
    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="beeswarm-dark-title beeswarm-dark-desc">
      <title id="beeswarm-dark-title">The median hides the tail</title>
      <desc id="beeswarm-dark-desc">The median hides the tail. Beeswarm of 138 per-request latency samples for one checkout endpoint on a shared linear value axis from zero; vertical spread is packing only and carries no value. The median is 122.5 ms, p99 is 396.8 ms, and the three requests past 380 ms form the tail.</desc>
      <rect width="100%" height="100%" fill="#010102"/>

      <!-- Range-frame value axis: the rule spans only the data (first dot to last dot), not the plot box. No gridlines: four bound ticks carry the scale, and the two reference lines below are the only other vertical rules. Scale is linear from zero, x = 80 + 2·ms. -->
      <line data-axis="x" x1="184" y1="420" x2="942" y2="420" stroke="#8a8f98" stroke-width="1"/>

      <!-- Tick labels are BOUND: data-tick names the (one) value axis and data-value the number the tick claims to sit at. verify-beeswarm.py cross-checks each against the scale the dots themselves describe. -->
      <text data-tick="x" data-value="100" x="280" y="440" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">100</text>
      <text data-tick="x" data-value="200" x="480" y="440" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">200</text>
      <text data-tick="x" data-value="300" x="680" y="440" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">300</text>
      <text data-tick="x" data-value="400" x="880" y="440" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">400</text>
      <text x="184" y="462" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace">Per-request latency, ms</text>

      <!-- Comparison: the median and the p99 of the dots below, drawn behind them as soft 1px dashed 4,3 rules with direct labels. verify-beeswarm.py recomputes both from the dots. -->
      <line data-ref="median" data-value="122.5" x1="325" y1="64" x2="325" y2="420" stroke="#8a8f98" stroke-width="1" stroke-dasharray="4,3"/>
      <text data-ref="median" data-role="label" x="325" y="52" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">Median 122.5 ms</text>
      <line data-ref="p99" data-value="396.8" x1="873.6" y1="64" x2="873.6" y2="420" stroke="#8a8f98" stroke-width="1" stroke-dasharray="4,3"/>
      <text data-ref="p99" data-role="label" x="873.6" y="52" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">p99 396.8 ms</text>
