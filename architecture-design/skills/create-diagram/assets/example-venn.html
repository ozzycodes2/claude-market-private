<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good design · Desirable × Feasible × Viable</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f8f8f8;
      --color-ink:     #171717;
      --color-muted:   #4d4d4d;
      --color-accent:  #ef6306;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-mono:     'SF Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Venn · Diagram Design</p>
    <h1>Good design · Desirable × Feasible × Viable</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="venn-title venn-desc">
      <title id="venn-title">A product ships only where all three tests overlap</title>
      <desc id="venn-desc">A product ships only where all three tests overlap. Venn diagram showing desirable, feasible, and viable product qualities intersecting at shippable.</desc>
        <defs>
          <!-- Chained clips isolate the all-three intersection: clip to Desirable, then to Feasible, then fill via the third circle. -->
          <clipPath id="clip-desirable">
            <circle cx="500" cy="180" r="140"/>
          </clipPath>
          <clipPath id="clip-feasible">
            <circle cx="428" cy="320" r="140"/>
          </clipPath>
        </defs>

        <rect width="100%" height="100%" fill="#f8f8f8"/>

        <!-- Three set circles (stroke + very-low-opacity tint; tints compound in overlaps) -->
        <!-- Desirable — top, ink -->
        <circle cx="500" cy="180" r="140" fill="rgba(23,23,23,0.04)" stroke="#171717" stroke-width="1"/>
        <!-- Feasible — bottom-left, muted -->
        <circle cx="428" cy="320" r="140" fill="rgba(77,77,77,0.05)" stroke="#4d4d4d" stroke-width="1"/>
        <!-- Viable — bottom-right, soft -->
        <circle cx="572" cy="320" r="140" fill="rgba(97,97,97,0.05)" stroke="#616161" stroke-width="1"/>

        <!-- Focal: solid-ink triple intersection (dark fill for white text to read against) -->
        <g clip-path="url(#clip-desirable)">
          <g clip-path="url(#clip-feasible)">
            <circle cx="572" cy="320" r="140" fill="#171717"/>
          </g>
        </g>

        <!-- Set labels — positioned INSIDE each circle's non-overlapping lobe, so the diagram reads like a classic Venn -->
        <!-- Desirable — top lobe (centered inside top of Desirable circle) -->
        <text x="500" y="96" fill="#171717" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Desirable</text>
        <text x="500" y="112" fill="#4d4d4d" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">People want it</text>

        <!-- Feasible — bottom-left lobe -->
        <text x="340" y="386" fill="#171717" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Feasible</text>
        <text x="340" y="402" fill="#4d4d4d" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">We can build it</text>

        <!-- Viable — bottom-right lobe -->
        <text x="660" y="386" fill="#171717" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Viable</text>
        <text x="660" y="402" fill="#4d4d4d" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">Business sustains</text>

        <!-- Focal label: white text on the dark intersection -->
        <text x="500" y="268" fill="#ffffff" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Shippable</text>
        <text x="500" y="284" fill="rgba(248,248,248,0.75)" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">The sweet spot</text>

        <!-- Source line -->
        <text data-role="source" x="40" y="456" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace">Source: illustrative design framework, 2026. No quantities plotted.<tspan x="40" dy="12">Circles are equal size, so areas and overlaps are not to scale and encode no counts.</tspan></text>
      </svg>
  </div>
</body>
</html>
