<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloud budget bridge · Waterfall chart · dark</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #010102;
      --color-ink:    #f7f8f8;
      --color-muted:  #d0d6e0;
      --color-accent: #ef6306;
      --font-sans:    'Inter', system-ui, sans-serif;
      --font-mono:    'SF Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-sans); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    .diagram-container { width: 100%; overflow-x: auto; }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Waterfall · Diagram Design</p>
    <h1>Cloud budget bridge · FY25 → FY26</h1>

    <div class="diagram-container">
    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="waterfall-dark-title waterfall-dark-desc">
<title id="waterfall-dark-title">Cloud budget bridge · FY25 → FY26</title>
<desc id="waterfall-dark-desc">Waterfall chart bridging the FY25 cloud budget of 240 thousand dollars a month to the FY26 plan of 236, in nominal dollars, through headcount growth, reserved-instance savings, new ML workloads, and storage tiering, the largest saving.</desc>
<rect width="100%" height="100%" fill="#010102"/>
<text x="80" y="28" fill="#d0d6e0" font-size="7" font-family="'SF Mono', monospace">Cloud spend, $K per month</text>
<line x1="80" y1="420" x2="960" y2="420" stroke="#8a8f98" stroke-width="1"/>
<line x1="208" y1="192" x2="256" y2="192" stroke="rgba(247,248,248,0.40)" stroke-width="1" data-carry="240"/>
<line x1="352" y1="131" x2="400" y2="131" stroke="rgba(247,248,248,0.40)" stroke-width="1" data-carry="304"/>
<line x1="496" y1="167" x2="544" y2="167" stroke="rgba(247,248,248,0.40)" stroke-width="1" data-carry="266"/>
<line x1="640" y1="146" x2="688" y2="146" stroke="rgba(247,248,248,0.40)" stroke-width="1" data-carry="288"/>
<line x1="784" y1="196" x2="832" y2="196" stroke="rgba(247,248,248,0.40)" stroke-width="1" data-carry="236"/>
<rect x="112" y="192" width="96" height="228" fill="#010102"/>
<rect x="112" y="192" width="96" height="228" fill="rgba(247,248,248,0.08)" stroke="#f7f8f8" stroke-width="1" data-role="total" data-value="240" data-name="FY25 base"/>
<text x="160" y="184" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">240</text>
<rect x="256" y="131" width="96" height="61" fill="#010102"/>
<rect x="256" y="131" width="96" height="61" fill="rgba(208,214,224,0.15)" stroke="#d0d6e0" stroke-width="1" data-role="delta" data-value="+64" data-name="Headcount"/>
<text x="304" y="123" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">+64</text>
<rect x="400" y="131" width="96" height="36" fill="#010102"/>
<rect x="400" y="131" width="96" height="36" fill="#010102" stroke="#d0d6e0" stroke-width="1" data-role="delta" data-value="-38" data-name="Reserved instances"/>
<text x="448" y="179" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">−38</text>
<rect x="544" y="146" width="96" height="21" fill="#010102"/>
<rect x="544" y="146" width="96" height="21" fill="rgba(208,214,224,0.15)" stroke="#d0d6e0" stroke-width="1" data-role="delta" data-value="+22" data-name="ML workloads"/>
<text x="592" y="138" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">+22</text>
<rect x="688" y="146" width="96" height="50" fill="#010102"/>
<rect x="688" y="146" width="96" height="50" fill="#010102" stroke="#ef6306" stroke-width="1.8" data-role="delta" data-value="-52" data-name="Storage tiering"/>
<text x="736" y="208" fill="#f7f8f8" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle" font-weight="600">−52</text>
<rect x="832" y="196" width="96" height="224" fill="#010102"/>
<rect x="832" y="196" width="96" height="224" fill="rgba(247,248,248,0.08)" stroke="#f7f8f8" stroke-width="1" data-role="total" data-value="236" data-name="FY26 plan"/>
<text x="880" y="188" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle">236</text>
<text x="736" y="222" fill="#f7f8f8" font-size="9" font-family="'Inter', sans-serif" text-anchor="middle" font-style="italic">Largest saving</text>
<text x="160" y="440" fill="#f7f8f8" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle" font-weight="600">FY25 base</text>
<text x="304" y="440" fill="#f7f8f8" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle" font-weight="600">Headcount</text>
<text x="448" y="440" fill="#f7f8f8" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle" font-weight="600">Reserved instances</text>
<text x="592" y="440" fill="#f7f8f8" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle" font-weight="600">ML workloads</text>
<text x="736" y="440" fill="#f7f8f8" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle" font-weight="600">Storage tiering</text>
<text x="880" y="440" fill="#f7f8f8" font-size="11" font-family="'Inter', sans-serif" text-anchor="middle" font-weight="600">FY26 plan</text>
<text x="40" y="478" fill="#d0d6e0" font-size="8.5" font-family="'Inter', sans-serif">Source: FY25 budget and FY26 plan. Nominal dollars, not adjusted for inflation; bars start at zero.</text>
<rect x="40" y="488" width="16" height="10" rx="2" fill="rgba(247,248,248,0.08)" stroke="#f7f8f8" stroke-width="1"/>
<text x="64" y="497" fill="#d0d6e0" font-size="8.5" font-family="'Inter', sans-serif">Start or end total</text>
<rect x="200" y="488" width="16" height="10" rx="2" fill="rgba(208,214,224,0.15)" stroke="#d0d6e0" stroke-width="1"/>
<text x="224" y="497" fill="#d0d6e0" font-size="8.5" font-family="'Inter', sans-serif">Cost added</text>
<rect x="340" y="488" width="16" height="10" rx="2" fill="#010102" stroke="#d0d6e0" stroke-width="1"/>
<text x="364" y="497" fill="#d0d6e0" font-size="8.5" font-family="'Inter', sans-serif">Cost removed</text>
</svg>
    </div>
  </div>
</body>
</html>
