<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weekly signups by region · Small multiples</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-family: var(--font-sans); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    svg { width: 100%; min-width: 760px; display: block; }
  </style>
</head>

  <div class="frame">
    <p class="eyebrow">Line · Diagram Design</p>
    <h1>Latin America jumped after the W4 launch</h1>

        <text x="276" y="212" fill="#4d4d4d" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">W8</text>

        <text data-ref="mean" data-role="label" x="284" y="138" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace">Mean: 57</text>
        <polyline data-line="North America" data-values="96,98,101,99,103,105,104,108" points="80,96 108,94 136,91 164,93 192,89 220,87 248,88 276,84" fill="none" stroke="#171717" stroke-width="1.2" stroke-linejoin="round"/>

      </g>
      <text data-role="source" x="64" y="472" fill="#4d4d4d" font-size="8" font-family="'SF Mono', monospace"><tspan x="64">Source: illustrative signups by region, W1 to W8. Signups per week. Same x and y scales in every panel, y 0 to 120.</tspan><tspan x="64" dy="12">Dashed line: mean of all 48 region-weeks, 57 a week.</tspan></text>
    </svg>
  </div>
</body>
</html>
