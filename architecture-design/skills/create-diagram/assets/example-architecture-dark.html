<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Content site · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #010102;
      --color-ink:     #f7f8f8;
      --color-muted:   #d0d6e0;
      --color-accent:  #ef6306;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-mono:     'SF Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · Diagram Design</p>
    <h1>Content site in production</h1>

    <svg viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-dark-title architecture-dark-desc">
      <title id="architecture-dark-title">Content site in production</title>
      <desc id="architecture-dark-desc">Architecture diagram showing reader requests moving through Cloudflare to an Astro origin, MDX bundle, and content CMS.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#d0d6e0"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#ef6306"/></marker>
          <marker id="arrow-ink" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f7f8f8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#010102"/>

        <!-- Zone: Content services (drawn before arrows and nodes) -->
        <rect x="616" y="128" width="164" height="272" rx="8"
              fill="rgba(247,248,248,0.03)" stroke="rgba(247,248,248,0.10)" stroke-width="0.8"/>
        <rect x="672" y="132" width="52" height="12" rx="2" fill="#010102"/>
        <text x="698" y="141" fill="rgba(247,248,248,0.35)" font-size="7" font-family="'SF Mono', monospace"
              text-anchor="middle" letter-spacing="0.14em">CONTENT</text>

        <!-- Arrows first (behind boxes) -->
        <line x1="168" y1="272" x2="220" y2="272" stroke="#f7f8f8" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
        <line x1="364" y1="272" x2="416" y2="272" stroke="#ef6306" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 576,260 H 692 Q 700,260 700,252 V 224"
              fill="none" stroke="#d0d6e0" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M 576,284 H 692 Q 700,284 700,292 V 320"
              fill="none" stroke="#d0d6e0" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Dashed return: Cloudflare→Reader (cached HTML) -->
        <path d="M 220,288 H 168" fill="none" stroke="#d0d6e0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

        <!-- Arrow labels -->
        <rect x="172" y="252" width="48" height="12" rx="2" fill="#010102"/>
        <text x="196" y="262" fill="#f7f8f8" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HTTPS</text>

        <rect x="172" y="278" width="32" height="12" rx="2" fill="#010102"/>
        <text x="188" y="287" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RESP</text>

        <rect x="368" y="252" width="48" height="12" rx="2" fill="#010102"/>
        <text x="392" y="262" fill="#f7f8f8" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SSR</text>

        <rect x="632" y="240" width="60" height="12" rx="2" fill="#010102"/>
        <text x="662" y="249" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle" letter-spacing="0.08em">READ MDX</text>

        <rect x="632" y="292" width="44" height="12" rx="2" fill="#010102"/>
        <text x="654" y="301" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" text-anchor="middle" letter-spacing="0.08em">QUERY</text>

        <!-- Node: Reader -->
        <rect x="40" y="240" width="128" height="64" rx="6" fill="#010102"/>
        <rect x="40" y="240" width="128" height="64" rx="6" fill="rgba(208,214,224,0.10)" stroke="#8a8f98" stroke-width="1"/>
        <rect x="48" y="248" width="28" height="12" rx="2" fill="transparent" stroke="rgba(138,143,152,0.40)" stroke-width="0.8"/>
        <text x="62" y="257" fill="#8a8f98" font-size="7" font-family="'SF Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
        <text x="104" y="276" fill="#f7f8f8" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Reader</text>
        <text x="104" y="292" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">Browser</text>

        <!-- Node: Cloudflare -->
        <rect x="220" y="240" width="144" height="64" rx="6" fill="#010102"/>
        <rect x="220" y="240" width="144" height="64" rx="6" fill="rgba(247,248,248,0.03)" stroke="rgba(247,248,248,0.30)" stroke-width="1"/>
        <rect x="228" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(247,248,248,0.22)" stroke-width="0.8"/>
        <text x="244" y="257" fill="#8a8f98" font-size="7" font-family="'SF Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EDGE</text>
        <text x="356" y="300" fill="rgba(247,248,248,0.06)" font-size="32" font-weight="600" font-family="'SF Mono', monospace" text-anchor="end">01</text>
        <text x="292" y="276" fill="#f7f8f8" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Cloudflare</text>
        <text x="292" y="292" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">Pages · cache</text>

        <!-- Node: Astro (focal accent) -->
        <rect x="416" y="240" width="160" height="64" rx="6" fill="#010102"/>
        <rect x="416" y="240" width="160" height="64" rx="6" fill="rgba(239,99,6,0.08)" stroke="#ef6306" stroke-width="1"/>
        <rect x="424" y="248" width="32" height="12" rx="2" fill="transparent" stroke="rgba(239,99,6,0.50)" stroke-width="0.8"/>
        <text x="440" y="257" fill="#f7f8f8" font-size="7" font-family="'SF Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ORIG</text>
        <text x="568" y="300" fill="rgba(239,99,6,0.10)" font-size="32" font-weight="600" font-family="'SF Mono', monospace" text-anchor="end">02</text>
        <text x="496" y="276" fill="#f7f8f8" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Astro Origin</text>
        <text x="496" y="292" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">SSR + MDX</text>

        <!-- Node: MDX Bundle -->
        <rect x="628" y="160" width="144" height="64" rx="6" fill="#010102"/>
        <rect x="628" y="160" width="144" height="64" rx="6" fill="#0f1011" stroke="#f7f8f8" stroke-width="1"/>
        <rect x="636" y="168" width="32" height="12" rx="2" fill="transparent" stroke="rgba(247,248,248,0.40)" stroke-width="0.8"/>
        <text x="652" y="177" fill="#f7f8f8" font-size="7" font-family="'SF Mono', monospace" text-anchor="middle" letter-spacing="0.08em">BUN</text>
        <text x="700" y="196" fill="#f7f8f8" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">MDX Bundle</text>
        <text x="700" y="212" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">src/content/*.mdx</text>

        <!-- Node: Content CMS -->
        <rect x="628" y="320" width="144" height="64" rx="6" fill="#010102"/>
        <rect x="628" y="320" width="144" height="64" rx="6" fill="rgba(247,248,248,0.05)" stroke="#d0d6e0" stroke-width="1"/>
        <rect x="636" y="328" width="28" height="12" rx="2" fill="transparent" stroke="rgba(208,214,224,0.50)" stroke-width="0.8"/>
        <text x="650" y="337" fill="#d0d6e0" font-size="7" font-family="'SF Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CMS</text>
        <text x="700" y="356" fill="#f7f8f8" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Content CMS</text>
        <text x="700" y="372" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">assets · og images</text>

        <!-- Legend strip -->
        <line x1="40" y1="404" x2="960" y2="404" stroke="rgba(247,248,248,0.10)" stroke-width="0.8"/>
        <text x="40" y="420" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="40" y="436" width="14" height="10" rx="2" fill="rgba(239,99,6,0.08)" stroke="#ef6306" stroke-width="1"/>
        <text x="60" y="444" fill="#d0d6e0" font-size="8.5" font-family="'Inter', sans-serif">Focal / origin</text>

        <rect x="180" y="436" width="14" height="10" rx="2" fill="#0f1011" stroke="#f7f8f8" stroke-width="1"/>
        <text x="200" y="444" fill="#d0d6e0" font-size="8.5" font-family="'Inter', sans-serif">Backend / bundle</text>

        <rect x="340" y="436" width="14" height="10" rx="2" fill="rgba(247,248,248,0.05)" stroke="#d0d6e0" stroke-width="1"/>
        <text x="360" y="444" fill="#d0d6e0" font-size="8.5" font-family="'Inter', sans-serif">Store</text>

        <rect x="436" y="436" width="14" height="10" rx="2" fill="rgba(247,248,248,0.03)" stroke="rgba(247,248,248,0.30)" stroke-width="1"/>
        <text x="456" y="444" fill="#d0d6e0" font-size="8.5" font-family="'Inter', sans-serif">Cloud</text>

        <rect x="528" y="436" width="14" height="10" rx="2" fill="rgba(208,214,224,0.10)" stroke="#8a8f98" stroke-width="1"/>
        <text x="548" y="444" fill="#d0d6e0" font-size="8.5" font-family="'Inter', sans-serif">External</text>

        <line x1="636" y1="442" x2="664" y2="442" stroke="#f7f8f8" stroke-width="1.2" marker-end="url(#arrow-ink)"/>
        <text x="672" y="444" fill="#d0d6e0" font-size="8.5" font-family="'Inter', sans-serif">HTTP request</text>

        <line x1="784" y1="442" x2="812" y2="442" stroke="#ef6306" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="820" y="444" fill="#d0d6e0" font-size="8.5" font-family="'Inter', sans-serif">Primary flow</text>

        <line x1="900" y1="442" x2="928" y2="442" stroke="#d0d6e0" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
        <text x="936" y="444" fill="#d0d6e0" font-size="8.5" font-family="'Inter', sans-serif">Return / async</text>
      </svg>
  </div>
</body>
</html>
