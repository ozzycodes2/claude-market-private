<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good design · Desirable × Feasible × Viable</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Sans+KR:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #010102;
      --color-ink:     #f7f8f8;
      --color-muted:   #d0d6e0;
      --color-accent:  #ef6306;
      --font-sans:     'Inter', system-ui, sans-serif;
      --font-mono:     'SF Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-sans);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Venn · Diagram Design</p>
    <h1>Good design · Desirable × Feasible × Viable</h1>

    <svg viewBox="0 0 1000 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="venn-dark-title venn-dark-desc">
      <title id="venn-dark-title">A product ships only where all three tests overlap</title>
      <desc id="venn-dark-desc">A product ships only where all three tests overlap. Venn diagram showing desirable, feasible, and viable product qualities intersecting at shippable.</desc>
        <defs>

          <clipPath id="clip-center">
            <circle cx="500" cy="180" r="140"/>
          </clipPath>
          <clipPath id="clip-center-2">
            <circle cx="428" cy="320" r="140"/>
          </clipPath>
        </defs>

        <rect width="100%" height="100%" fill="#010102"/>

        <!-- Three set circles (stroke + very-low-opacity tint; tints compound in overlaps) -->
        <!-- Desirable — top, ink -->
        <circle cx="500" cy="180" r="140" fill="rgba(247,248,248,0.04)" stroke="#f7f8f8" stroke-width="1"/>
        <!-- Feasible — bottom-left, muted -->
        <circle cx="428" cy="320" r="140" fill="rgba(208,214,224,0.05)" stroke="#d0d6e0" stroke-width="1"/>
        <!-- Viable — bottom-right, soft -->
        <circle cx="572" cy="320" r="140" fill="rgba(138,143,152,0.05)" stroke="#8a8f98" stroke-width="1"/>

        <!-- Accent focal tint on the all-three intersection -->
        <g clip-path="url(#clip-center)">
          <g clip-path="url(#clip-center-2)">
            <circle cx="572" cy="320" r="140" fill="rgba(239,99,6,0.14)"/>
          </g>
        </g>

        <!-- Set labels -->
        <text x="500" y="20" fill="#f7f8f8" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Desirable</text>
        <text x="500" y="36" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">People want it</text>

        <text x="152" y="400" fill="#d0d6e0" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="start">Feasible</text>
        <text x="152" y="416" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace" text-anchor="start">We can build it</text>

        <text x="848" y="400" fill="#8a8f98" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="end">Viable</text>
        <text x="848" y="416" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace" text-anchor="end">Business sustains</text>

        <!-- Pairwise intersection labels -->
        <text x="360" y="232" fill="#d0d6e0" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Prototype</text>
        <text x="360" y="248" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">no business model</text>

        <text x="640" y="232" fill="#d0d6e0" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Vaporware</text>
        <text x="640" y="248" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">can't build it</text>

        <text x="500" y="368" fill="#d0d6e0" font-size="12" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Internal tool</text>
        <text x="500" y="384" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">nobody wants it</text>

        <!-- Focal: all-three center -->
        <text x="500" y="260" fill="#f7f8f8" font-size="14" font-weight="600" font-family="'Inter', sans-serif" text-anchor="middle">Shippable</text>
        <text x="500" y="276" fill="#d0d6e0" font-size="9" font-family="'SF Mono', monospace" text-anchor="middle">The sweet spot</text>

        <!-- Source line -->
        <text data-role="source" x="40" y="464" fill="#d0d6e0" font-size="8" font-family="'SF Mono', monospace">Source: illustrative design framework, 2026. No quantities plotted.<tspan x="40" dy="12">Circles are equal size, so areas and overlaps are not to scale and encode no counts.</tspan></text>
      </svg>
  </div>
</body>
</html>
